<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a72bbd">
<title>トーク</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
  background: #000;
  color: #444;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  position: relative;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 600px) {
  .app {
    width: 390px;
    height: min(844px, 94vh);
    border-radius: 36px;
    box-shadow: 0 0 0 8px #222;
  }
}

.header {
  flex: 0 0 82px;
  height: 82px;
  background: linear-gradient(110deg, #d36ae1 0%, #ad35c4 55%, #9219ad 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  position: relative;
  padding-top: env(safe-area-inset-top);
  z-index: 5;
}

.header-title {
  font-size: 23px;
  font-weight: 500;
  max-width: 58%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  color: #fff;
  padding: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.back {
  left: 16px;
  text-decoration: none;
  font-size: 38px;
  font-weight: 200;
  line-height: 1;
}

.mail {
  right: 65px;
}

.menu {
  right: 14px;
  font-size: 25px;
  letter-spacing: 1px;
}

.header-button svg {
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: #fff;
  scrollbar-width: none;
  padding: 0 12px calc(22px + env(safe-area-inset-bottom));
  overscroll-behavior: contain;
}

.main::-webkit-scrollbar {
  display: none;
}

.post {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  column-gap: 12px;
  margin: 3px 0 48px;
  align-items: start;
}

.avatar-wrap {
  padding-top: 2px;
  display: flex;
  justify-content: center;
}

.avatar {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  object-fit: cover;
  background: #f7e1d2;
}

.post-body {
  min-width: 0;
}

.post-meta {
  height: 34px;
  display: flex;
  align-items: flex-start;
  gap: 18px;
  min-width: 0;
  font-size: 18px;
  line-height: 1.35;
  white-space: nowrap;
}

.post-name {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 52%;
  color: #444;
}

.post-date {
  color: #555;
  font-size: 17px;
}

.post-menu {
  margin-left: auto;
  border: 0;
  background: none;
  color: #aaa;
  font-size: 22px;
  line-height: 14px;
  padding: 0 1px;
  cursor: pointer;
}

.bubble {
  position: relative;
  background: #f6f6f6;
  border-radius: 6px;
  padding: 28px 28px 30px;
  min-height: 74px;
  font-size: 18px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.bubble:before {
  content: "";
  position: absolute;
  left: -12px;
  top: 12px;
  border-width: 0 13px 14px 0;
  border-style: solid;
  border-color: transparent #f6f6f6 transparent transparent;
}

.post-image {
  display: block;
  width: auto;
  max-width: min(100%, 260px);
  max-height: 470px;
  object-fit: contain;
  border-radius: 6px;
  margin: 0 auto 24px;
  cursor: zoom-in;
}

.message {
  white-space: pre-wrap;
}

.loading,
.empty,
.error {
  padding: 50px 16px;
  text-align: center;
  color: #999;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
}

/* 上方向の追加読み込み */

.older-loader {
  display: none;
  text-align: center;
  padding: 18px 10px 25px;
  color: #999;
  font-size: 13px;
}

.older-loader.show {
  display: block;
}

.spinner {
  width: 23px;
  height: 23px;
  border: 2px solid #e8d9eb;
  border-top-color: #a72bbd;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 9px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 最新へ戻るボタン */

.to-bottom {
  position: absolute;
  right: 14px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #a72bbd;
  color: #fff;
  font-size: 23px;
  line-height: 1;
  box-shadow: 0 2px 6px #0003;
  cursor: pointer;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
}

.to-bottom.show {
  display: flex;
}

/* 画像拡大表示 */

.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, .94);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 50px 12px;
}

.image-viewer.show {
  display: flex;
}

.image-viewer img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 3px;
  user-select: none;
}

.viewer-close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: 14px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.16);
  color: #fff;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

@media (max-width: 380px) {
  .post {
    grid-template-columns: 62px minmax(0, 1fr);
    column-gap: 8px;
  }

  .avatar {
    width: 56px;
    height: 56px;
  }

  .post-meta {
    gap: 9px;
    font-size: 16px;
  }

  .post-date {
    font-size: 15px;
  }

  .bubble {
    padding: 22px 20px 24px;
    font-size: 16px;
  }

  .post-image {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <a class="header-button back"
       href="./index.html"
       aria-label="戻る">‹</a>

    <div class="header-title" id="roomTitle">トーク</div>

    <button class="header-button mail"
            type="button"
            aria-label="Letter"
            id="letterButton">
      <svg viewBox="0 0 32 32">
        <rect x="2.5" y="5" width="27" height="21" rx="1.5"/>
        <path d="m3.5 7 12.5 11L28.5 7"/>
      </svg>
    </button>

    <button class="header-button menu"
            id="menuButton"
            type="button"
            aria-label="メニュー">•••</button>

  </header>

  <main class="main" id="main">

    <div class="loading" id="status">
      投稿を読み込んでいます…
    </div>

    <div class="older-loader" id="olderLoader">
      <div class="spinner"></div>
      古い投稿を読み込んでいます…
    </div>

    <div id="posts"></div>

  </main>

  <button class="to-bottom"
          id="toBottom"
          type="button"
          aria-label="最新の投稿へ戻る">↓</button>

</div>

<!-- 画像拡大表示 -->

<div class="image-viewer" id="imageViewer">

  <button class="viewer-close"
          id="viewerClose"
          type="button"
          aria-label="閉じる">×</button>

  <img id="viewerImage" src="" alt="拡大画像">

</div>

<script src="Owner.js" defer></script>
<script src="Internet.js" defer></script>

</body>
</html>
