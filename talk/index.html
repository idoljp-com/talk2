<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a72bbd">
<title>トーク</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Noto Sans JP", sans-serif;
  background: #000;
  color: #444;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  position: relative;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 600px) {
  .app {
    width: 390px;
    height: min(844px, 94vh);
    border-radius: 36px;
    box-shadow: 0 0 0 8px #222;
  }
}

/* ヘッダー */
.header {
  flex: 0 0 82px;
  height: 82px;
  background: linear-gradient(
    110deg,
    #d36ae1 0%,
    #ad35c4 55%,
    #9219ad 100%
  );
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  position: relative;
  padding-top: env(safe-area-inset-top);
  z-index: 5;
}

.header-title {
  font-size: 23px;
  font-weight: 500;
  max-width: 58%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  color: #fff;
  padding: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.back {
  left: 16px;
  text-decoration: none;
  font-size: 38px;
  font-weight: 200;
  line-height: 1;
}

.mail {
  right: 65px;
}

.menu {
  right: 14px;
  font-size: 25px;
  letter-spacing: 1px;
}

.header-button svg {
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* メイン */
.main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: #fff;
  scrollbar-width: none;
  padding: 0 12px calc(22px + env(safe-area-inset-bottom));
  overscroll-behavior: contain;
}

.main::-webkit-scrollbar {
  display: none;
}

/* 投稿 */
.post {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  column-gap: 12px;
  margin: 3px 0 48px;
  align-items: start;
}

.avatar-wrap {
  padding-top: 2px;
  display: flex;
  justify-content: center;
}

.avatar {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  object-fit: cover;
  background: #f7e1d2;
}

.post-body {
  min-width: 0;
}

.post-meta {
  height: 34px;
  display: flex;
  align-items: flex-start;
  gap: 18px;
  min-width: 0;
  font-size: 18px;
  line-height: 1.35;
  white-space: nowrap;
}

.post-name {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 52%;
  color: #444;
}

.post-date {
  color: #555;
  font-size: 17px;
}

.post-menu {
  margin-left: auto;
  border: 0;
  background: none;
  color: #aaa;
  font-size: 22px;
  line-height: 14px;
  padding: 0 1px;
  cursor: pointer;
}

.bubble {
  position: relative;
  background: #f6f6f6;
  border-radius: 6px;
  padding: 28px 28px 30px;
  min-height: 74px;
  font-size: 18px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.bubble:before {
  content: "";
  position: absolute;
  left: -12px;
  top: 12px;
  border-width: 0 13px 14px 0;
  border-style: solid;
  border-color: transparent #f6f6f6 transparent transparent;
}

.post-image {
  display: block;
  width: auto;
  max-width: min(100%, 260px);
  max-height: 470px;
  object-fit: contain;
  border-radius: 6px;
  margin: 0 auto 24px;
  cursor: zoom-in;
}

.message {
  white-space: pre-wrap;
}

/* 状態表示 */
.loading,
.empty,
.error {
  padding: 50px 16px;
  text-align: center;
  color: #999;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
}

/* 古い投稿の読み込み */
.older-loader {
  display: none;
  text-align: center;
  padding: 18px 10px 25px;
  color: #999;
  font-size: 13px;
}

.older-loader.show {
  display: block;
}

.spinner {
  width: 23px;
  height: 23px;
  border: 2px solid #e8d9eb;
  border-top-color: #a72bbd;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 9px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* 最新の投稿へ戻る */
.to-bottom {
  position: absolute;
  right: 14px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #a72bbd;
  color: #fff;
  font-size: 23px;
  line-height: 1;
  box-shadow: 0 2px 6px #0003;
  cursor: pointer;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
}

.to-bottom.show {
  display: flex;
}

/* 画像拡大表示 */
.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, .94);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 50px 12px;
}

.image-viewer.show {
  display: flex;
}

.image-viewer img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 3px;
  user-select: none;
}

.viewer-close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: 14px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .16);
  color: #fff;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 小さい画面 */
@media (max-width: 380px) {
  .post {
    grid-template-columns: 62px minmax(0, 1fr);
    column-gap: 8px;
  }

  .avatar {
    width: 56px;
    height: 56px;
  }

  .post-meta {
    gap: 9px;
    font-size: 16px;
  }

  .post-date {
    font-size: 15px;
  }

  .bubble {
    padding: 22px 20px 24px;
    font-size: 16px;
  }

  .post-image {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ヘッダー -->
  <header class="header">

    <a
      class="header-button back"
      href="../index.html"
      aria-label="戻る"
    >‹</a>

    <div class="header-title" id="roomTitle">トーク</div>

    <button
      class="header-button mail"
      type="button"
      aria-label="Letter"
      id="letterButton"
    >
      <svg viewBox="0 0 32 32">
        <rect x="2.5" y="5" width="27" height="21" rx="1.5"/>
        <path d="m3.5 7 12.5 11L28.5 7"/>
      </svg>
    </button>

    <button
      class="header-button menu"
      id="menuButton"
      type="button"
      aria-label="メニュー"
    >•••</button>

  </header>

  <!-- 投稿一覧 -->
  <main class="main" id="main">

    <div class="loading" id="status">
      投稿を読み込んでいます…
    </div>

    <div class="older-loader" id="olderLoader">
      <div class="spinner"></div>
      古い投稿を読み込んでいます…
    </div>

    <div id="posts"></div>

  </main>

  <!-- 最新の投稿へ戻る -->
  <button
    class="to-bottom"
    id="toBottom"
    type="button"
    aria-label="最新の投稿へ戻る"
  >↓</button>

</div>

<!-- 画像拡大表示 -->
<div class="image-viewer" id="imageViewer">

  <button
    class="viewer-close"
    id="viewerClose"
    type="button"
    aria-label="閉じる"
  >×</button>

  <img id="viewerImage" src="" alt="拡大画像">

</div>

<script>
(() => {
  'use strict';

  /* ========================================
     ルーム設定
  ======================================== */

  const ROOM_CONFIG = {
    Owner_3saka: {
      source: 'Owner',
      title: '🔞ガールズルール🔞'
    },

    Internet_nogizaka46: {
      source: 'Internet',
      title: '乃木坂46',
      group: 'nogizaka46'
    },

    Internet_sakurazaka46: {
      source: 'Internet',
      title: '櫻坂46',
      group: 'sakurazaka46'
    },

    Internet_hinatazaka46: {
      source: 'Internet',
      title: '日向坂46',
      group: 'hinatazaka46'
    }
  };

  const params = new URLSearchParams(location.search);
  const roomKey = params.get('room') || '';
  const room = ROOM_CONFIG[roomKey];

  /* ========================================
     HTML要素
  ======================================== */

  const titleEl = document.getElementById('roomTitle');
  const statusEl = document.getElementById('status');
  const postsEl = document.getElementById('posts');
  const mainEl = document.getElementById('main');
  const olderLoader = document.getElementById('olderLoader');
  const toBottom = document.getElementById('toBottom');

  const imageViewer = document.getElementById('imageViewer');
  const viewerImage = document.getElementById('viewerImage');

  /* ========================================
     投稿読み込み設定
  ======================================== */

  const POSTS_PER_LOAD = 20;

  let allPosts = [];
  let nextIndex = 0;
  let loadingOlder = false;
  let allLoaded = false;

  /* ========================================
     ルーム判定
  ======================================== */

  if (!room) {
    titleEl.textContent = 'トーク';

    statusEl.className = 'error';
    statusEl.textContent =
      'ルーム指定が正しくありません。\nトップページから選択してください。';

    return;
  }

  titleEl.textContent = room.title;

  /* ========================================
     Letter画面へ移動
  ======================================== */

  document.getElementById('letterButton').addEventListener('click', () => {
    location.href = '../index.html?tab=letter';
  });

  /* ========================================
     メニュー
  ======================================== */

  document.getElementById('menuButton').addEventListener('click', () => {
    alert('メニュー');
  });

  /* ========================================
     データ設定JSの読み込み
  ======================================== */

  function loadSourceScript() {
    return new Promise((resolve, reject) => {

      const script = document.createElement('script');

      script.src = new URL(
        './' + room.source + '.js',
        document.baseURI
      ).href;

      script.onload = resolve;

      script.onerror = () => {
        reject(
          new Error(
            room.source +
            '.js を読み込めません。talkフォルダ内に配置してください。'
          )
        );
      };

      document.head.appendChild(script);
    });
  }

  /* ========================================
     CSV解析
  ======================================== */

  function parseCSV(text) {

    const rows = [];

    let row = [];
    let field = '';
    let quoted = false;

    for (let i = 0; i < text.length; i++) {

      const c = text[i];
      const next = text[i + 1];

      if (quoted) {

        if (c === '"' && next === '"') {
          field += '"';
          i++;

        } else if (c === '"') {
          quoted = false;

        } else {
          field += c;
        }

      } else if (c === '"') {

        quoted = true;

      } else if (c === ',') {

        row.push(field);
        field = '';

      } else if (c === '\n') {

        row.push(field);
        rows.push(row);

        row = [];
        field = '';

      } else if (c !== '\r') {

        field += c;

      }
    }

    row.push(field);

    if (row.some(v => v !== '')) {
      rows.push(row);
    }

    return rows;
  }

  /* ========================================
     列名の正規化
  ======================================== */

  function normalizeHeader(value) {

    return String(value || '')
      .replace(/^\uFEFF/, '')
      .trim()
      .replace(/\s/g, '')
      .toLowerCase();
  }

  /* ========================================
     列番号の取得
  ======================================== */

  function findColumn(headers, candidates) {

    const normalized = headers.map(normalizeHeader);

    for (const candidate of candidates) {

      const index = normalized.indexOf(
        normalizeHeader(candidate)
      );

      if (index !== -1) {
        return index;
      }
    }

    return -1;
  }

  /* ========================================
     画像URLの安全確認
  ======================================== */

  function safeImageUrl(value) {

    const raw = String(value || '').trim();

    if (!raw) return '';

    try {

      const url = new URL(raw);

      return (
        url.protocol === 'http:' ||
        url.protocol === 'https:'
      ) ? url.href : '';

    } catch (_) {

      return '';
    }
  }

  /* ========================================
     日付を数値化
  ======================================== */

  function dateValue(value) {

    const raw = String(value || '').trim();

    const match = raw.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/
    );

    if (match) {

      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4] || 0),
        Number(match[5] || 0)
      ).getTime();
    }

    return new Date(raw).getTime();
  }

  /* ========================================
     日付表示
  ======================================== */

  function formatDate(value) {

    const raw = String(value || '').trim();

    if (!raw) return '';

    const match = raw.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/
    );

    if (match) {

      return (
        `${Number(match[2])}/${Number(match[3])}` +
        (
          match[4]
            ? ` ${String(match[4]).padStart(2, '0')}:${match[5]}`
            : ''
        )
      );
    }

    const date = new Date(raw);

    if (!Number.isNaN(date.getTime())) {

      return (
        `${date.getMonth() + 1}/${date.getDate()} ` +
        `${String(date.getHours()).padStart(2, '0')}:` +
        `${String(date.getMinutes()).padStart(2, '0')}`
      );
    }

    return raw;
  }

  /* ========================================
     画像拡大表示
  ======================================== */

  function openImage(src) {

    viewerImage.src = src;
    imageViewer.classList.add('show');
  }

  function closeImage() {

    imageViewer.classList.remove('show');
    viewerImage.src = '';
  }

  document
    .getElementById('viewerClose')
    .addEventListener('click', closeImage);

  imageViewer.addEventListener('click', event => {

    if (event.target === imageViewer) {
      closeImage();
    }
  });

  document.addEventListener('keydown', event => {

    if (event.key === 'Escape') {
      closeImage();
    }
  });

  /* ========================================
     投稿HTML作成
  ======================================== */

  function createPost(item) {

    const article = document.createElement('article');
    article.className = 'post';

    /* 投稿者アイコン */

    const avatarWrap = document.createElement('div');
    avatarWrap.className = 'avatar-wrap';

    const avatar = document.createElement('img');

    avatar.className = 'avatar';
    avatar.alt = item.from;
    avatar.loading = 'lazy';

    avatar.src = new URL(
      '../user_img/' + encodeURIComponent(item.from) + '.jpeg',
      document.baseURI
    ).href;

    avatar.onerror = () => {
      avatar.style.visibility = 'hidden';
    };

    avatarWrap.appendChild(avatar);

    /* 投稿本文 */

    const body = document.createElement('div');
    body.className = 'post-body';

    /* 投稿者名・日付 */

    const meta = document.createElement('div');
    meta.className = 'post-meta';

    const name = document.createElement('span');
    name.className = 'post-name';
    name.textContent = item.from;

    const date = document.createElement('span');
    date.className = 'post-date';
    date.textContent = formatDate(item.date);

    const more = document.createElement('button');

    more.className = 'post-menu';
    more.type = 'button';
    more.textContent = '•••';
    more.setAttribute('aria-label', '投稿メニュー');

    more.addEventListener('click', () => {
      alert('投稿メニュー');
    });

    meta.append(name, date, more);
    body.appendChild(meta);

    /* 吹き出し */

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    /* 投稿画像 */

    if (item.image) {

      const image = document.createElement('img');

      image.className = 'post-image';
      image.src = item.image;
      image.alt = '投稿画像';
      image.loading = 'lazy';

      image.addEventListener('click', () => {
        openImage(item.image);
      });

      image.onerror = () => {
        image.remove();
      };

      bubble.appendChild(image);
    }

    /* メッセージ */

    if (item.message) {

      const message = document.createElement('div');

      message.className = 'message';
      message.textContent = item.message;

      bubble.appendChild(message);
    }

    /* 画像・本文が両方空の場合 */

    if (!item.image && !item.message) {

      const empty = document.createElement('div');

      empty.className = 'message';
      empty.textContent = '（画像・本文はありません）';

      bubble.appendChild(empty);
    }

    body.appendChild(bubble);

    article.append(avatarWrap, body);

    return article;
  }

  /* ========================================
     投稿を画面に追加
  ======================================== */

  function renderPosts(items, prepend = false) {

    const fragment = document.createDocumentFragment();

    items.forEach(item => {
      fragment.appendChild(createPost(item));
    });

    if (prepend) {
      postsEl.prepend(fragment);
    } else {
      postsEl.appendChild(fragment);
    }
  }

  /* ========================================
     最新投稿ボタンの表示制御
  ======================================== */

  function updateBottomButton() {

    const remaining =
      mainEl.scrollHeight -
      mainEl.clientHeight -
      mainEl.scrollTop;

    toBottom.classList.toggle(
      'show',
      remaining > 200
    );
  }

  /* ========================================
     初回投稿表示
  ======================================== */

  function renderInitialPosts() {

    const start = Math.max(
      0,
      allPosts.length - POSTS_PER_LOAD
    );

    nextIndex = start;

    renderPosts(allPosts.slice(start));

    allLoaded = nextIndex === 0;

    statusEl.remove();

    requestAnimationFrame(() => {

      mainEl.scrollTop = mainEl.scrollHeight;

      updateBottomButton();
    });
  }

  /* ========================================
     古い投稿を追加読み込み
  ======================================== */

  async function loadOlderPosts() {

    if (loadingOlder || allLoaded) return;

    loadingOlder = true;

    olderLoader.classList.add('show');

    await new Promise(resolve => {
      requestAnimationFrame(resolve);
    });

    try {

      const oldHeight = mainEl.scrollHeight;
      const oldTop = mainEl.scrollTop;

      const start = Math.max(
        0,
        nextIndex - POSTS_PER_LOAD
      );

      const olderPosts = allPosts.slice(
        start,
        nextIndex
      );

      if (!olderPosts.length) {

        allLoaded = true;

        return;
      }

      renderPosts(olderPosts, true);

      nextIndex = start;

      if (nextIndex === 0) {
        allLoaded = true;
      }

      requestAnimationFrame(() => {

        mainEl.scrollTop =
          oldTop + (mainEl.scrollHeight - oldHeight);

        updateBottomButton();
      });

    } catch (error) {

      console.error(
        '古い投稿の追加エラー:',
        error
      );

    } finally {

      olderLoader.classList.remove('show');

      loadingOlder = false;
    }
  }

  /* ========================================
     スクロールイベント
  ======================================== */

  mainEl.addEventListener('scroll', () => {

    if (
      mainEl.scrollTop < 150 &&
      !loadingOlder &&
      !allLoaded
    ) {
      loadOlderPosts();
    }

    updateBottomButton();
  });

  /* ========================================
     最新の投稿へ戻る
  ======================================== */

  toBottom.addEventListener('click', () => {

    mainEl.scrollTo({
      top: mainEl.scrollHeight,
      behavior: 'smooth'
    });
  });

  /* ========================================
     投稿データ取得
  ======================================== */

  async function loadPosts() {

    try {

      /* 対応するJSだけを読み込む */

      await loadSourceScript();

      const source =
        window.TALK_SOURCES &&
        window.TALK_SOURCES[room.source];

      if (!source || !source.csvUrl) {
        throw new Error(
          'データソース設定が見つかりません。'
        );
      }

      /* CSV取得 */

      const response = await fetch(
        source.csvUrl,
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const rows = parseCSV(
        await response.text()
      );

      if (rows.length < 2) {

        statusEl.className = 'empty';
        statusEl.textContent = '表示できる投稿がありません。';

        return;
      }

      /* ========================================
         列の特定
      ======================================== */

      const headers = rows[0];

      const dateIndex = findColumn(
        headers,
        ['日時', '日付', 'timestamp']
      );

      const fromIndex = findColumn(
        headers,
        ['from', '投稿者', '名前']
      );

      const imageIndex = findColumn(
        headers,
        ['画像URL', '画像 url', '画像', 'image', 'imageurl']
      );

      const groupIndex = findColumn(
        headers,
        ['グループ', 'group']
      );

      const messageIndex = findColumn(
        headers,
        ['本文', 'メッセージ', 'テキスト', '内容', 'message']
      );

      /* ========================================
         必須列チェック
      ======================================== */

      if (dateIndex === -1 || fromIndex === -1) {

        throw new Error(
          '必要な列（日時 / from）が見つかりません。CSVの1行目を確認してください。'
        );
      }

      if (source.filterByGroup && groupIndex === -1) {

        throw new Error(
          '必要な列（グループ）が見つかりません。'
        );
      }

      if (imageIndex === -1 && messageIndex === -1) {

        throw new Error(
          '画像URLまたは本文の列が見つかりません。'
        );
      }

      /* ========================================
         グループ名の正規化
      ======================================== */

      const normalizeGroup = value => {

        const group = String(value || '')
          .replace(/^\uFEFF/, '')
          .replace(/\s/g, '')
          .toLowerCase();

        const aliases = {

          '乃木坂46': 'nogizaka46',
          'nogizaka46': 'nogizaka46',

          '櫻坂46': 'sakurazaka46',
          '桜坂46': 'sakurazaka46',
          'sakurazaka46': 'sakurazaka46',

          '日向坂46': 'hinatazaka46',
          'hinatazaka46': 'hinatazaka46'
        };

        return aliases[group] || group;
      };

      /* ========================================
         投稿データ作成
      ======================================== */

      allPosts = rows.slice(1)
        .map(row => ({

          date: row[dateIndex] || '',

          from: String(
            row[fromIndex] || ''
          ).trim(),

          image: imageIndex === -1
            ? ''
            : safeImageUrl(row[imageIndex]),

          group: groupIndex === -1
            ? ''
            : normalizeGroup(row[groupIndex]),

          message: messageIndex === -1
            ? ''
            : String(row[messageIndex] || '').trim()

        }))
        .filter(item => {

          const groupMatches =
            !source.filterByGroup ||
            item.group === room.group;

          return (
            item.from &&
            groupMatches &&
            (item.image || item.message)
          );
        });

      /* ========================================
         日付順に並べ替え
      ======================================== */

      allPosts.sort((a, b) => {

        const da = dateValue(a.date);
        const db = dateValue(b.date);

        if (
          !Number.isNaN(da) &&
          !Number.isNaN(db)
        ) {
          return da - db;
        }

        return String(a.date).localeCompare(
          String(b.date),
          'ja'
        );
      });

      /* ========================================
         投稿がない場合
      ======================================== */

      if (!allPosts.length) {

        statusEl.className = 'empty';

        statusEl.textContent = source.filterByGroup
          ? 'このグループの投稿はありません。'
          : '表示できる投稿がありません。';

        return;
      }

      /* ========================================
         初回表示
      ======================================== */

      renderInitialPosts();

    } catch (error) {

      statusEl.className = 'error';

      statusEl.textContent =
        `投稿を取得できませんでした。\n` +
        `${error.message}\n\n` +
        `スプレッドシートがウェブに公開されているか、` +
        `列名・ファイル配置が正しいか確認してください。`;

      console.error(error);
    }
  }

  /* ========================================
     起動
  ======================================== */

  loadPosts();

})();
</script>

</body>
</html>
